services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: minipsp
      POSTGRES_USER: minipsp
      POSTGRES_PASSWORD: minipsp
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U minipsp -d minipsp"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  redpanda:
    # Kafka API compatible and a single process, so the local stack stays one
    # container instead of a broker plus a coordinator.
    image: redpandadata/redpanda:v24.2.7
    command:
      - redpanda
      - start
      - --smp=1
      - --overprovisioned
      - --node-id=0
      - --check=false
      # Two tokens, not --set=x: rpk consumes this itself, and joined with an
      # equals sign it gets forwarded to the broker, which rejects it.
      - --set
      - redpanda.auto_create_topics_enabled=true
      - --kafka-addr=INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      - --advertise-kafka-addr=INTERNAL://redpanda:29092,EXTERNAL://localhost:9092
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: src/Payments.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Payments: "Host=postgres;Port=5432;Database=minipsp;Username=minipsp;Password=minipsp"
      ConnectionStrings__Redis: "redis:6379"
      Kafka__BootstrapServers: "redpanda:29092"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    # No healthcheck here on purpose. A Docker HEALTHCHECK has to run a command
    # inside the container, and the aspnet runtime image ships without curl or
    # wget; adding one would trade image size and attack surface for a local
    # convenience. /health is still served, and an orchestrator probes it over
    # HTTP from outside, which needs nothing installed in the image.

  fake-provider:
    build:
      context: .
      dockerfile: src/Payments.FakeProvider/Dockerfile
    ports:
      - "8081:8080"

  worker:
    build:
      context: .
      dockerfile: src/Payments.Worker/Dockerfile
    environment:
      DOTNET_ENVIRONMENT: Development
      ConnectionStrings__Payments: "Host=postgres;Port=5432;Database=minipsp;Username=minipsp;Password=minipsp"
      Kafka__BootstrapServers: "redpanda:29092"
      Provider__Name: "fake"
      Provider__BaseUrl: "http://fake-provider:8080"
      Provider__TimeoutSeconds: "5"
    ports:
      - "8082:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      fake-provider:
        condition: service_started
    # The API owns migrations, so the worker can start against a schema that is
    # not there yet. Restarting until it is beats coordinating startup order.
    restart: unless-stopped

volumes:
  pgdata:
